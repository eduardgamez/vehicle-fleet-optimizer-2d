  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"eb9e5cad-b102-4cd0-a42d-d5b4c3e4bdfc\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<div style=\"width:330px;background:{{ t.winBg }};border:1px solid {{ t.winBorder }};border-radius:13px;box-shadow:{{ t.winShadow }};overflow:hidden;font-family:-apple-system,'SF Pro Text',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased\">\n  <!-- titlebar -->\n  <div style=\"display:flex;align-items:center;gap:10px;height:40px;padding:0 13px;background:{{ t.barBg }};border-bottom:1px solid {{ t.barBorder }}\">\n    <div style=\"display:flex;gap:7px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f57\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#febc2e\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#28c840\"><\u002Fspan><\u002Fdiv>\n    <span style=\"font-weight:600;font-size:12.5px;color:{{ t.barTitle }}\">Optimizador de flotas<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"background:{{ t.panelBg }};padding:14px 12px;display:flex;flex-direction:column;gap:12px\">\n\n    <!-- Parámetros -->\n    <div style=\"background:{{ t.cardBg }};border:1px solid {{ t.cardBorder }};border-radius:{{ t.cardRadius }};box-shadow:{{ t.cardShadow }};padding:13px 12px;display:flex;flex-direction:column;gap:11px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:3px;height:12px;border-radius:2px;background:{{ t.tick }}\"><\u002Fspan><span style=\"font-size:{{ t.titleSize }};font-weight:{{ t.titleWeight }};letter-spacing:{{ t.titleSpacing }};text-transform:{{ t.titleTransform }};color:{{ t.titleColor }}\">Parámetros<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between\"><span style=\"font-size:12.5px;color:{{ t.text }}\">Nº vehículos<\u002Fspan><input value=\"4\" style=\"width:52px;padding:6px 9px;background:{{ t.fieldBg }};border:none;border-radius:7px;color:{{ t.fieldColor }};font-size:12.5px;text-align:right;outline:none\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between\"><span style=\"font-size:12.5px;color:{{ t.text }}\">Densidad obstáculos<\u002Fspan><input value=\"0.0\" style=\"width:52px;padding:6px 9px;background:{{ t.fieldBg }};border:none;border-radius:7px;color:{{ t.fieldColor }};font-size:12.5px;text-align:right;outline:none\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between\"><span style=\"font-size:12.5px;color:{{ t.text }}\">Calidad de ruta<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:{{ t.sliderVal }}\">{{ quality }}<\u002Fspan><\u002Fdiv>\n        <div onpointerdown=\"{{ qdrag }}\" onpointermove=\"{{ qdrag }}\" style=\"position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none\">\n          <div style=\"position:absolute;left:0;right:0;height:4px;background:{{ t.sliderTrack }};border-radius:999px\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;width:{{ qpct }};height:4px;background:{{ t.sliderFill }};border-radius:999px\"><\u002Fdiv>\n          <div style=\"position:absolute;left:{{ qpct }};width:20px;height:20px;margin-left:-10px;background:#ffffff;border-radius:50%;box-shadow:0 0.5px 2px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.2)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;color:{{ t.muted }}\"><span>rápida<\u002Fspan><span>máxima<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Vehículos -->\n    <div style=\"background:{{ t.cardBg }};border:1px solid {{ t.cardBorder }};border-radius:{{ t.cardRadius }};box-shadow:{{ t.cardShadow }};padding:13px 12px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:3px;height:12px;border-radius:2px;background:{{ t.tick }}\"><\u002Fspan><span style=\"font-size:{{ t.titleSize }};font-weight:{{ t.titleWeight }};letter-spacing:{{ t.titleSpacing }};text-transform:{{ t.titleTransform }};color:{{ t.titleColor }}\">Vehículos<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;background:{{ t.segTrackBg }};border-radius:9px;padding:2px\">\n        <div style=\"{{ srcThumb }}\"><\u002Fdiv>\n        <button onclick=\"{{ setAlea }}\" style=\"{{ srcAlea }}\">Aleatorio<\u002Fbutton>\n        <button onclick=\"{{ setMan }}\" style=\"{{ srcMan }}\">Manual<\u002Fbutton>\n      <\u002Fdiv>\n      <button style=\"display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;background:{{ t.insBg }};border:none;border-radius:11px;color:{{ t.insColor }};font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 13h11V7H3z\"><\u002Fpath><path d=\"M14 10h4l3 3v3h-7z\"><\u002Fpath><circle cx=\"7\" cy=\"17.5\" r=\"1.6\"><\u002Fcircle><circle cx=\"17\" cy=\"17.5\" r=\"1.6\"><\u002Fcircle><\u002Fsvg>Insertar vehículos<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Optimización -->\n    <div style=\"background:{{ t.cardBg }};border:1px solid {{ t.cardBorder }};border-radius:{{ t.cardRadius }};box-shadow:{{ t.cardShadow }};padding:13px 12px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:3px;height:12px;border-radius:2px;background:{{ t.tick }}\"><\u002Fspan><span style=\"font-size:{{ t.titleSize }};font-weight:{{ t.titleWeight }};letter-spacing:{{ t.titleSpacing }};text-transform:{{ t.titleTransform }};color:{{ t.titleColor }}\ :100%;padding:10px;background:{{ t.btnBg }};border:none;border-radius:11px;color:{{ t.insColor }};font-size:12.5px;font-weight:600;cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-2.6-6.3\"><\u002Fpath><path d=\"M21 3v5h-5\"><\u002Fpath><\u002Fsvg>Nuevas rutas<\u002Fbutton>\n      <div style=\"display:flex;gap:8px\">\n        <button title=\"Reiniciar\" style=\"flex:1;display:flex;align-items:center;justify-content:center;height:38px;background:{{ t.btnBg }};border:none;border-radius:10px;color:{{ t.text }};cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"5\" y=\"4\" width=\"2.6\" height=\"16\" rx=\"1\"><\u002Frect><path d=\"M20 5 9 12l11 7z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <button onclick=\"{{ play }}\" title=\"Pausar / reanudar\" style=\"flex:1;display:flex;align-items:center;justify-content:center;height:38px;background:{{ t.btnBg }};border:none;border-radius:10px;color:{{ t.text }};cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\">\n          <sc-if value=\"{{ playing }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"4\" width=\"4.5\" height=\"16\" rx=\"1\"><\u002Frect><rect x=\"13.5\" y=\"4\" width=\"4.5\" height=\"16\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ paused }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M7 4.5v15l12-7.5z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n        <\u002Fbutton>\n        <button title=\"Reproducir de nuevo\" style=\"flex:1;display:flex;align-items:center;justi :none;border-radius:9px;color:{{ t.text }};font-size:11.5px;font-weight:500;cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ t.accent }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v11M8 10l4 4 4-4\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg>Importar<\u002Fbutton>\n        <button style=\"display:flex;align-items:center;gap:8px;padding:9px 10px;background:{{ t.mapTileBg }};border:none;border-radius:9px;color:{{ t.text }};font-size:11.5px;font-weight:500;cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ t.accent }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h11l3 3v13H5z\"><\u002Fpath><path d=\"M8 4v6h7\"><\u002Fpath><\u002Fsvg>Guardar<\u002Fbutton>\n        <button style=\"display:flex;align-items:center;gap:8px;padding:9px 10px;background:{{ t.mapTileBg }};border:none;border-radius:9px;color:{{ t.text }};font-size:11.5px;font-weight:500;cursor:pointer;transition:filter .15s\" style-hover=\"filter:brightness(0.9)\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ t.accent }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h6l2 2h10v11H3z\"><\u002Fpath><\u002Fsvg>Cargar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;330px&quot;,&quot;height&quot;:&quot;706px&quot;}}\">\nclass Component extends DCLogic {\n  state = { source: 'aleatorio', optim: 'secuencial', quality: 3, playing: false, dark: false };\n  componentDidMount() {\n    this.mq = window.matchMedia('(prefers-color-scheme: dark)');\n    this.setState({ dark: this.mq.matches });\n    this._onmq = (e) => this.setState({ dark: e.matches });\n    this.mq.addEventListener('change', this._onmq);\n  }\n  componentWillUnmount() { if (this.mq && this._onmq) this.mq.removeEventListener('change', this._onmq); }\n  set(f, v) { this.setState({ [f]: v }); }\n  qdrag(e) {\n    if (e.type === 'pointermove' && e.buttons !== 1) return;\n    const r = e.currentTarget.getBoundingClientRect();\n    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));\n    this.set('quality', Math.round(1 + p * 4));\n  }\n  renderVals() {\n    const light = {\n      winBg: '#ffffff', winBorder: '#e0e0e5', winShadow: '0 30px 70px -28px rgba(0,0,0,.32)',\n      barBg: '#f6f6f8', barBorder: '#e3e3e6', barTitle: '#1d1d1f', panelBg: '#f2f2f7',\n      cardBg: '#ffffff', cardBorder: '#e6e6ea', cardRadius: '12px', cardShadow: '0 1px 2px rgba(0,0,0,.05)',\n      text: '#1d1d1f', muted: '#86868b', tick: '#1d1d1f',\n      titleColor: '#5c5c62', titleTransform: 'uppercase', titleSize: '11px', titleWeight: '600', titleSpacing: '.05em',\n      fieldBg: '#eceef2', fieldColor: '#1d1d1f', accent: '#007aff',\n      sliderTrack: 'rgba(120,120,128,.22)', sliderFill: '#007aff', sliderVal: '#007aff',\n      segTrackBg: '#e9e9eb', segThumb: '#ffffff', segThumbShadow: '0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)', segSel: '#1d1d1f', segUnsel: '#6e6e73',\n      insBg: 'rgba(0,122,255,.12)', insColor: '#007aff',\n      primBg: '#007aff', primColor: '#ffffff', btnBg: '#e6e6eb', mapTileBg: '#eceef2',\n    };\n    const dark = {\n      winBg: '#1c1c1e', winBorder: 'rgba(0,0,0,.6)', winShadow: '0 30px 70px -26px rgba(0,0,0,.7)',\n      barBg: '#2c2c2e', barBorder: 'rgba(255,255,255,.08)', barTitle: '#f5f5f7', panelBg: '#1c1c1e',\n      cardBg: '#2c2c2e', cardBorder: 'rgba(255,255,255,.06)', cardRadius: '12px', cardShadow: 'none',\n      text: '#f5f5f7', muted: '#8e8e93', tick: '#f5f5f7',\n      titleColor: '#8e8e93', titleTransform: 'uppercase', titleSize: '11px', titleWeight: '600', titleSpacing: '.05em',\n      fieldBg: '#3a3a3c', fieldColor: '#f5f5f7', accent: '#0a84ff',\n      sliderTrack: 'rgba(120,120,128,.32)', sliderFill: '#0a84ff', sliderVal: '#0a84ff',\n      segTrackBg: '#1c1c1e', segThumb: '#636366', segThumbShadow: '0 3px 8px rgba(0,0,0,.4)', segSel: '#ffffff', segUnsel: '#aeaeb2',\n      insBg: 'rgba(10,132,255,.22)', insColor: '#4aa3ff',\n      primBg: '#0a84ff', primColor: '#ffffff', btnBg: '#3a3a3c', mapTileBg: '#3a3a3c',\n    };\n    const t = this.state.dark ? dark : light;\n    const s = this.state;\n    const segStyle = (on) => ({\n      flex: '1', position: 'relative', zIndex: 1, padding: '6px 4px', background: 'transparent', border: 'none',\n      borderRadius: '7px', fontSize: '12.5px', fontWeight: on ? '600' : '500', color: on ? t.segSel : t.segUnsel,\n      cursor: 'pointer', transition: 'color .2s', whiteSpace: 'nowrap',\n    });\n    const thumb = (i, N) => ({\n      position: 'absolute', top: '2px', bottom: '2px',\n      left: `calc(${i} * 100% / ${N} + 2px)`, width: `calc(100% / ${N} - 4px)`,\n      background: t.segThumb, borderRadius: '7px', boxShadow: t.segThumbShadow,\n      transition: 'left .26s cubic-bezier(.4,0,.2,1)',\n    });\n    const idxSrc = s.source === 'aleatorio' ? 0 : 1;\n    const idxOpt = s.optim === 'global' ? 0 : (s.optim === 'prioridades' ? 1 : 2);\n    return {\n      t, quality: s.quality, qpct: ((s.quality - 1) / 4 * 100) + '%', playing: s.playing, paused: !s.playing,\n      srcThumb: thumb(idxSrc, 2), optThumb: thumb(idxOpt, 3),\n      srcAlea: segStyle(s.source === 'aleatorio'), srcMan: segStyle(s.source === 'manual'),\n      optG: segStyle(s.optim === 'global'), optP: segStyle(s.optim === 'prioridades'), optS: segStyle(s.optim === 'secuencial'),\n      setAlea: () => this.set('source', 'aleatorio'), setMan: () => this.set('source', 'manual'),\n      setG: () => this.set('optim', 'global'), setP: () => this.set('optim', 'prioridades'), setS: () => this.set('optim', 'secuencial'),\n      play: () => this.set('playing', !s.playing), qdrag: (e) => this.qdrag(e),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
